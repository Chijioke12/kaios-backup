<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jetpack KaiOS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            position: relative;
            background: #000;
        }
        header {
            height: 28px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 14px;
        }
        footer {
            height: 30px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: #222;
        }
        #game-container {
            position: absolute;
            top: 28px;
            bottom: 30px;
            left: 0;
            right: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <header>Jetpack KaiOS</header>
    <div id="game-container"></div>
    <footer></footer>
    <script src="/pixi.js"></script>
    <script src="/p2.js"></script>
    <script src="/phaser.js"></script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
