<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chrono-Core - KaiOS Edition</title>
</head>
<body>
    <div id="device-wrapper">
        <div id="game-container">
            <canvas id="gameCanvas" width="240" height="320"></canvas>
            
            <div id="hud" class="hidden">
                <span>SCR: <span id="score-val">0</span></span>
                <span style="color: #f85149;">HULL: <span id="hp-val">100</span>%</span>
            </div>

            <div id="time-dial" class="hidden">
                <span>DILATION</span>
                <div class="time-bar-bg"><div class="time-bar-fill" id="time-bar"></div></div>
            </div>

            <div id="menu-screen" class="ui-layer">
                <h1>CHRONO-CORE</h1>
                <p>D-Pad: Move & Speed up Time</p>
                <p>Ship Auto-Aims at closest target.</p>
                <p><b>OK: Fire Laser</b></p>
                <p>Stop moving to slow time!</p>
                <div class="kai-btn" id="start-btn">[OK] BOOT</div>
            </div>

            <div id="gameover-screen" class="ui-layer hidden">
                <h1 style="color: #f85149;">BREACH</h1>
                <p>Kills: <span id="final-score">0</span></p>
                <div class="kai-btn" id="restart-btn" style="background: #f85149; color: #fff; border-color:#f85149;">[OK] REBOOT</div>
            </div>
        </div>

        <!-- Virtual D-Pad -->
        <div id="d-pad">
            <div class="d-btn" id="btn-up">▲</div>
            <div class="d-btn" id="btn-left">◀</div>
            <div class="d-btn" id="btn-ok">FIRE</div>
            <div class="d-btn" id="btn-right">▶</div>
            <div class="d-btn" id="btn-down">▼</div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
