<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Chroma Jump</title>
    <style>
        /* KaiOS & Feature Phone Optimized CSS + Gamepad Layout */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { 
            background-color: #1a1a2e; 
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevents mobile zooming/scrolling */
        }
        
        #console-wrapper {
            background: #111;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        #device-container {
            width: 240px;
            height: 320px;
            position: relative;
            background: #000;
            border: 2px solid #333;
            border-radius: 4px;
            overflow: hidden;
        }
        
        #gameCanvas {
            display: block;
            background: #0a0a1a;
        }

        /* UI Overlays */
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 26, 0.9);
            z-index: 10;
        }
        .hidden { display: none !important; }
        
        .title { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 20px; text-align: center; letter-spacing: 1px; }
        .title span:nth-child(1) { color: #00FFFF; text-shadow: 0 0 5px #00FFFF; }
        .title span:nth-child(2) { color: #FF00FF; text-shadow: 0 0 5px #FF00FF; }
        
        .menu-item { font-size: 16px; margin: 8px 0; color: #888; transition: 0.1s; }
        .menu-item.active { color: #fff; font-weight: bold; text-shadow: 0 0 5px #fff; transform: scale(1.1); }
        
        .score-display {
            position: absolute;
            top: 5px; left: 5px;
            font-size: 14px; font-weight: bold; color: #fff;
            text-shadow: 1px 1px 2px #000;
            z-index: 5;
        }

        /* KaiOS Softkey Bar */
        #softkey-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 25px;
            background: #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
            font-size: 12px;
            font-weight: bold;
            color: #ccc;
            border-top: 1px solid #444;
            z-index: 20;
        }
        .sk-btn { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; cursor: pointer; padding: 4px 0;}
        .sk-btn:active { background: #444; }
        #sk-left { text-align: left; padding-left: 4px; }
        #sk-right { text-align: right; padding-right: 4px; }
        #sk-center { color: #fff; font-weight: 900; text-transform: uppercase; }

        /* On-Screen D-Pad Controller */
        #controller-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 260px;
            padding: 0 10px;
        }
        
        #dpad {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px 50px;
            gap: 2px;
        }
        
        .c-btn {
            background: #2a2a35;
            border: 2px solid #111;
            border-radius: 8px;
            color: #888;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 4px 6px rgba(0,0,0,0.5);
            transition: background 0.05s, transform 0.05s;
        }
        
        .c-btn:active {
            background: #445;
            transform: translateY(2px);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.5);
            color: #fff;
        }
        
        #btn-up { grid-column: 2; grid-row: 1; border-radius: 8px 8px 4px 4px; }
        #btn-left { grid-column: 1; grid-row: 2; border-radius: 8px 4px 4px 8px; }
        #btn-right { grid-column: 3; grid-row: 2; border-radius: 4px 8px 8px 4px; }
        #btn-down { grid-column: 2; grid-row: 3; border-radius: 4px 4px 8px 8px; }
        
        /* The Action Button (Matches game colors) */
        #action-btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80px;
            height: 80px;
        }
        
        #btn-ok { 
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF00FF, #7B00FF);
            border: 3px solid #111;
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: inset 0 3px 5px rgba(255,255,255,0.3), 0 5px 10px rgba(0,0,0,0.5);
            transition: transform 0.05s, box-shadow 0.05s;
        }
        
        #btn-ok:active {
            transform: scale(0.92) translateY(2px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.5);
        }

    </style>
</head>
<body>

<div id="console-wrapper">
    <div id="device-container">
        <div id="score" class="score-display">0</div>
        <canvas id="gameCanvas"></canvas>

        <!-- Menu Screen -->
        <div id="menu-screen" class="screen">
            <div class="title"><span>CHROMA</span> <span>JUMP</span></div>
            <div class="menu-item active" id="menu-play">Play Game</div>
            <div class="menu-item" id="menu-help">How to Play</div>
            <div style="font-size:10px; margin-top:20px; color:#555;">Match platform colors!</div>
        </div>

        <!-- Help Screen -->
        <div id="help-screen" class="screen hidden">
            <div class="title" style="font-size:16px;">HOW TO PLAY</div>
            <div style="font-size:12px; text-align:center; padding:0 10px; line-height:1.5;">
                Move: <span style="color:#00FFFF">D-Pad ◀ ▶</span><br>
                Change Color: <span style="color:#FF00FF">OK Button</span><br><br>
                You can ONLY bounce on platforms that match your current color.<br>
                Don't fall!
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <div class="title" style="color: #FF4444;">GAME OVER</div>
            <div style="font-size: 14px; margin-bottom: 10px;">Score: <span id="final-score">0</span></div>
            <div class="menu-item active">Try Again</div>
        </div>

        <!-- Softkeys Overlay (Touchable) -->
        <div id="softkey-bar">
            <div class="sk-btn" id="sk-left">Exit</div>
            <div class="sk-btn" id="sk-center">SELECT</div>
            <div class="sk-btn" id="sk-right"></div>
        </div>
    </div>

    <!-- On-Screen D-Pad Controls -->
    <div id="controller-area">
        <div id="dpad">
            <div class="c-btn" id="btn-up">▲</div>
            <div class="c-btn" id="btn-left">◀</div>
            <div style="grid-column: 2; grid-row: 2; display: flex; justify-content: center; align-items: center; color: #444; font-size: 10px;">🎮</div>
            <div class="c-btn" id="btn-right">▶</div>
            <div class="c-btn" id="btn-down">▼</div>
        </div>
        <div id="action-btn-container">
            <div id="btn-ok">OK</div>
        </div>
    </div>
</div>

<script src="./index-inline-1.js" type="module"></script>

</body></html>
